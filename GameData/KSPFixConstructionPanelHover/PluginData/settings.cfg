// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Forgets the contacts of a part held in EVA construction mode when the game hides it (cursor over the construction
// panel or a part action window) or shows it again, so that it does not stay red for good.
hiddenPartContactsReset = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line for each clear that dropped
// contacts, with their names.
logLevel = Info
